name: kakan
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_launcher_icons: ^0.14.3
  dio: ^5.8.0+1
  http: ^1.3.0  # Pinned to match lottie
  internet_connection_checker_plus: ^2.7.0
  get_it: ^8.0.3
  flutter_bloc: ^9.1.1
  dartz: ^0.10.1
  connectivity_plus: ^6.1.3
  pin_code_fields: ^8.0.1
  gap: ^3.0.1
  lottie: ^3.3.1
  flutter_onboarding_slider: ^1.0.11
  video_player: ^2.9.3
  persistent_bottom_nav_bar: ^6.2.1
  flutter_secure_storage: ^9.2.4
  equatable: ^2.0.7
  flutter_speed_dial: ^7.0.0
  youtube_player_flutter: ^9.1.1
  youtube_explode_dart: ^2.4.2
  path_provider: ^2.1.5
  permission_handler: ^11.4.0
  device_info_plus: ^11.3.3
  fluttertoast: ^8.2.8
  buttons_tabbar: ^1.3.15
  cached_network_image: ^3.4.1
  image_picker: ^1.1.2
  toastification: ^3.0.2
  go_router: ^15.1.1
  ffmpeg_kit_flutter_new: ^2.0.0
  video_editor_2: ^3.1.1
  mime: ^2.0.0
  # flutter_ringtone_manager: ^1.1.2
  # set_ringtone: ^1.0.0  # Replaced ringtone_set
  file_picker: ^10.1.9
  logger: ^2.5.0
  shared_preferences: ^2.5.3
  flutter_dotenv: ^5.2.1
  audio_waveforms: ^1.3.0
  ringtone_set_plus: ^0.0.2+2
  flutter_cache_manager: ^3.4.1
  # photo_manager: ^3.7.0
  just_audio: ^0.9.46  # Downgraded to a version compatible with voice_message_package
  voice_message_package: ^2.2.1
  chucker_flutter: ^1.8.5
  webview_flutter: ^4.13.0
  visibility_detector: ^0.4.0+2
  flutter_spinkit: ^5.2.1
  youtube_player_iframe: ^5.2.1
  audioplayers: ^6.5.0
  youtube: ^2.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mockito: ^5.4.6
  build_runner: ^2.4.15

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/kakan.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/media/
    - assets/images/avatars/
    - .env
  fonts:
    - family: Product Sans
      fonts:
        - asset: assets/fonts/ProductSans-Regular.ttf
    - family: Prosto One
      fonts:
        - asset: assets/fonts/ProstoOne-Regular.ttf